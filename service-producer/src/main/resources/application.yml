spring:
  application:
    name: service-producer
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/${DB_NAME:mtls_db}
    username: ${DB_USERNAME:mtls}
    # Jasypt-encrypted; decrypted at startup with JASYPT_ENCRYPTOR_PASSWORD (see README)
    password: ENC(NO0tYiQShpiblv/VUfihJX9MT1/xeEAuV5taQv2avcJV+qFzwnjquEvz7qIJYZYC)
  flyway:
    enabled: true
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true
  ssl:
    bundle:
      jks:
        service-producer:
          key:
            alias: service-producer
          keystore:
            location: ${SSL_KEYSTORE_LOCATION:classpath:ssl/service-producer-keystore.p12}
            password: ${KEYSTORE_PASSWORD:changeit}
            type: PKCS12
          truststore:
            location: ${SSL_TRUSTSTORE_LOCATION:classpath:ssl/truststore.p12}
            password: ${TRUSTSTORE_PASSWORD:changeit}
            type: PKCS12
          options:
            enabled-protocols: TLSv1.3,TLSv1.2

jasypt:
  encryptor:
    password: ${JASYPT_ENCRYPTOR_PASSWORD}
    algorithm: PBEWITHHMACSHA512ANDAES_256
    key-obtention-iterations: 1000
    iv-generator-classname: org.jasypt.iv.RandomIvGenerator

server:
  port: 8443
  ssl:
    bundle: service-producer
    # "need" = handshake fails unless the client presents a cert chaining to the truststore
    client-auth: need

mtls:
  allowed-client-cns:
    - service-consumer

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    info:
      access: read-only
  info:
    git:
      mode: full
    build:
      enabled: true
    env:
      enabled: true
    java:
      enabled: true
    os:
      enabled: true

info:
  app:
    name: ${spring.application.name}
    description: mTLS provider — PostgreSQL-backed REST endpoint that requires and validates client certificates
    version: 0.0.1-SNAPSHOT
    client-auth: ${server.ssl.client-auth}

logging:
  level:
    com.org.mtls: INFO
